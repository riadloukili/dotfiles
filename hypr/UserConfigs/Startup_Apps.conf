# Commands and Apps to be executed at launch

$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts


# wallpaper stuff 
exec-once = awww-daemon --format argb && awww img $HOME/.config/hypr/wallpaper.png
#exec-once = mpvpaper '*' -o "load-scripts=no no-audio --loop" $livewallpaper

# wallpaper random
#exec-once = $SwwwRandom $wallDIR # random wallpaper switcher every 30 minutes

# Startup
# shikane - dynamic output/display profile manager (auto-applies on hotplug)
exec-once = shikane
# export env to systemd/dbus, THEN start the session target.
# xdg-desktop-portal.service has Requisite=graphical-session.target - without this
# start, portal activation always fails and screensharing (ScreenCast) is dead.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE HYPRLAND_INSTANCE_SIGNATURE && systemctl --user start hyprland-session.target

# Polkit (Polkit Gnome / KDE)
exec-once = systemctl --user start hyprpolkitagent

# starup apps
exec-once = nm-applet --indicator
exec-once = swaync
#exec-once = ags
exec-once = blueman-applet
#exec-once = rog-control-center
exec-once = waybar

#clipboard manager
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Starting hypridle to start hyprlock
exec-once = hypridle


# Here are list of features available but disabled by default
