# Prompt: os · dir · git on the left, ❯ below; host location icon
# ($CLOUD_PROVIDER, set per host by nixos-config), status, duration and
# toolchains on the right. Colours come from the terminal palette, which
# caelestia re-themes with the wallpaper.
add_newline = true
format = "$os$directory$git_branch$git_status$line_break$character"
right_format = "${custom.aws}${custom.hetzner}${custom.digitalocean}${custom.home}$status$cmd_duration$jobs$direnv$nix_shell$python$nodejs$golang$rust$time"

[os]
disabled = false
style = "bold white"
format = "[$symbol]($style)  "

[os.symbols]
NixOS = ""
Arch = ""
Debian = ""
Ubuntu = ""
Macos = ""
Linux = ""

[directory]
style = "bold blue"
format = "[$path]($style)[$read_only](red) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold red"
format = "([$all_status$ahead_behind]($style) )"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

# Host location, same icons/colours as the old p10k segment
[custom.aws]
when = '[ "$CLOUD_PROVIDER" = "aws" ]'
command = "printf ''"
style = "bold 208"
format = "[$output]($style) "
shell = ["sh"]

[custom.hetzner]
when = '[ "$CLOUD_PROVIDER" = "hetzner" ]'
command = "printf ''"
style = "bold red"
format = "[$output]($style) "
shell = ["sh"]

[custom.digitalocean]
when = '[ "$CLOUD_PROVIDER" = "digitalocean" ]'
command = "printf ''"
style = "bold 39"
format = "[$output]($style) "
shell = ["sh"]

[custom.home]
when = '[ "$CLOUD_PROVIDER" = "home" ]'
command = "printf ''"
style = "bold green"
format = "[$output]($style) "
shell = ["sh"]

[status]
disabled = false
format = "[✘ $status]($style) "

[cmd_duration]
min_time = 2000
format = "[ $duration](bold yellow) "

[jobs]
format = "[✦ $number](bold blue) "

[direnv]
disabled = false
format = "[direnv $loaded]($style) "

[nix_shell]
format = "[ $state]($style) "

[python]
format = "[ ${version}( $virtualenv)]($style) "
[nodejs]
format = "[ $version]($style) "
[golang]
format = "[ $version]($style) "
[rust]
format = "[ $version]($style) "

[time]
disabled = false
format = "[$time](dimmed white)"
time_format = "%H:%M"
