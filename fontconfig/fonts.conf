<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- The fonts shipped here are copied to ~/.local/share/fonts/dotfiles at
       home-manager activation, which fontconfig already scans. Pointing a
       <dir> at the checkout instead makes them visible to fontconfig but
       unreadable by sandboxed processes such as Firefox's content children. -->

  <!-- Google Sans as the preferred sans-serif / monospace; other fonts stay as fallback. -->
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Google Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Google Sans Mono</string></edit>
  </match>
</fontconfig>
