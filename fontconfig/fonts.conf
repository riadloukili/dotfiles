<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Fonts shipped with the dotfiles (Google Sans + Nerd variants: waybar/rofi/gtk use them). -->
  <dir>~/personal/dotfiles/fonts</dir>

  <!-- Google Sans as the preferred sans-serif / monospace; other fonts stay as fallback. -->
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Google Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Google Sans Mono</string></edit>
  </match>
</fontconfig>
