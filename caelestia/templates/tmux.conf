# tmux in the scheme's colours: caelestia fills this in on every scheme
# change and writes it to ~/.local/state/caelestia/theme/tmux.conf, which
# tmux/tmux.conf sources over its fallbacks. Running servers reload through
# the postHook in cli.json.

# Status bar pill in the third accent (minimal-tmux-status reads these when
# it loads), so it is not the same colour as the active pane's border
set -g @minimal-tmux-bg "#{{ tertiary.hex }}"
set -g @minimal-tmux-fg "#{{ onTertiary.hex }}"

# Command and message bar: it shows in the status line, so the bar's colour
set -g message-style bg=default,fg='#{{ tertiary.hex }}',bold
set -g message-command-style bg=default,fg='#{{ tertiary.hex }}',bold

# Pane borders: the active one in the accent, the rest dimmed
set -g pane-active-border-style fg='#{{ primary.hex }}'
set -g pane-border-style fg='#{{ outlineVariant.hex }}'
