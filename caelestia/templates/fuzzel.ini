# fuzzel (caelestia's clipboard and emoji pickers), filled in with the scheme
# colours by caelestia on every scheme change and written to
# ~/.local/state/caelestia/theme/fuzzel.ini, which fuzzel/fuzzel.ini includes.
# Replaces caelestia's built-in fuzzel template (enableFuzzel is off in
# cli.json), which hardcodes JetBrains Mono: this one uses the shell's font.
font=Google Sans Flex:size=17
terminal=kitty -e
prompt="> "
layer=overlay
lines=15
width=60
dpi-aware=no
inner-pad=10
horizontal-pad=40
vertical-pad=15
match-counter=yes

[colors]
background={{ surface.hex }}dd
text={{ onSurface.hex }}dd
prompt={{ primary.hex }}ff
placeholder={{ outline.hex }}ff
input={{ onSurface.hex }}ff
match={{ tertiary.hex }}ff
selection={{ primary.hex }}87
selection-text={{ onSurface.hex }}ff
selection-match={{ tertiary.hex }}ff
counter={{ outline.hex }}ff
border={{ primary.hex }}77

[border]
radius=10
width=2
