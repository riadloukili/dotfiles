# Set prefix to Ctrl-s
set -g prefix C-s
unbind C-b
bind C-s send-prefix

# Enable mouse support
set -g mouse on

# Set default terminal
set -g default-terminal "tmux-256color"

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer size
set -g history-limit 50000

# Tmux messages display time (in milliseconds)
set -g display-time 700

# Enable vi mode keys
setw -g mode-keys vi

# Necessary for neovim's 3rd/image.nvim
set -g visual-activity off

# Kitty keyboard protocol support (Claude Code Shift+Enter, notifications, etc.)
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Reload config file
bind r source-file ~/.config/tmux/tmux.conf \; run-shell "notify-send -e 'tmux' 'Config reloaded!'"

# Copy mode bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ---

# New windows open in current directory
bind c new-window -c "#{pane_current_path}"

# New panes open in current directory (horizontal split)
bind '"' split-window -c "#{pane_current_path}"

# New panes open in current directory (vertical split)
bind % split-window -h -c "#{pane_current_path}"

# ---

# Make command and message bar consistent with our style
set -g message-style bg=default,fg='#698DDA',bold
set -g message-command-style bg=default,fg='#698DDA',bold

# TPM (Tmux Plugin Manager)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'niksingh710/minimal-tmux-status'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'laktak/extrakto'

set -g @extrakto_popup_size "55%"

# Navigate panes with Ctrl+arrows instead of the plugin's Ctrl+hjkl.
# WARN: must be set before TPM runs at the bottom of this file; the plugin
# reads these when its script loads, not when the keys are pressed.
set -g @vim_navigator_mapping_left "C-Left"
set -g @vim_navigator_mapping_down "C-Down"
set -g @vim_navigator_mapping_up "C-Up"
set -g @vim_navigator_mapping_right "C-Right"

# Save and restore the session with prefix+S / prefix+R. WARN: resurrect
# defaults save to prefix+C-s, which collided with `bind C-s send-prefix`
# above and, being bound when TPM runs at the bottom, silently won.
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'

# Minimal tmux status configuration
set -g @minimal-tmux-fg "#000000"
set -g @minimal-tmux-bg "#698DDA"
set -g @minimal-tmux-justify "centre"
set -g @minimal-tmux-indicator-str "  "
set -g @minimal-tmux-indicator true
set -g @minimal-tmux-status "top"

# Enable left and right status bar
set -g @minimal-tmux-right true
set -g @minimal-tmux-left true

# Expanded icon (fullscreen icon)
set -g @minimal-tmux-expanded-icon "󰊓 "

# Show expanded icons for all tabs
set -g @minimal-tmux-show-expanded-icons-for-all-tabs true

# Extra text in status bar
set -g @minimal-tmux-status-right-extra ""
set -g @minimal-tmux-status-left-extra ""

# Use arrows for selection box
set -g @minimal-tmux-use-arrow true
set -g @minimal-tmux-right-arrow ""
set -g @minimal-tmux-left-arrow ""

# Status bar content
set -g @minimal-tmux-status-right " #{?#{session_group}, #{session_group}, #{session_name}} "

set -g @minimal-tmux-window-status-format " #I󱁐#W "

# Status bar length
set -g status-right-length 20
set -g status-left-length 20

# Toggle status bar with prefix+b
bind-key b set-option status

# Auto-install plugins if they don't exist
# if-shell "test -f ~/.config/tmux/plugins/tpm/tpm && test ! -d ~/.tmux/plugins/tmux-sensible" \
#    "run '~/.config/tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
if-shell "test -f ~/.config/tmux/plugins/tpm/tpm" \
   "run-shell '~/.config/tmux/plugins/tpm/tpm'"
